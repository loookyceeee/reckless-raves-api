services:
  - type: web
    name: reckless-raves-api
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: node server/serve.mjs
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: reckless-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATA_DIR
        value: /data
      - key: AUTH_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: XP_SHEET_ID
        sync: false
      - key: SKIDDLE_API_KEY
        sync: false
      # Optional Behold.so JSON feed (https://feeds.behold.so/…). Leave unset until the website supplies a URL.
      - key: BEHOLD_FEED_URL
        sync: false
      # RECKLESS WORLD events are stored either way. Real XP stays off until this is set to 1.
      # sync:false so a later dashboard flip is not reset by a blueprint sync. Unset or 0 = off.
      - key: GAME_XP_LIVE
        sync: false
      # RECKLESS social (GOING, check-ins, rave diary, badges). Unset or 0 = off for every fan.
      # SOCIAL_TEST_EMAILS (comma-separated) can use it while it is off; their XP rows are test:true.
      - key: SOCIAL_LIVE
        sync: false
      - key: SOCIAL_TEST_EMAILS
        sync: false
      # Check-in QR links. Unset = the QR points at this service's own host (onrender.com).
      # A custom domain here also needs the app's associatedDomains / intent filter updated and a new build.
      - key: CHECKIN_LINK_BASE
        sync: false
      # Android App Links: SHA-256 signing cert fingerprint(s) from EAS credentials, comma-separated. Unset = assetlinks.json 404.
      - key: ANDROID_CERT_SHA256
        sync: false
      # iOS universal links. Unset = XY99374YG6.
      - key: APPLE_TEAM_ID
        sync: false
      # Admin page (/admin). Unset = admin off. Luke sets the value in the dashboard.
      - key: ADMIN_PASSWORD
        sync: false
      # App Store downloads card (Sales and Trends API).
      - key: ASC_KEY_P8
        sync: false
      - key: ASC_KEY_ID
        sync: false
      - key: ASC_ISSUER_ID
        sync: false
      - key: ASC_VENDOR_NUMBER
        sync: false
